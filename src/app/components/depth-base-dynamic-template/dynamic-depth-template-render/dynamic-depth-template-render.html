<div class="col-lg-12 d-flex justify-content-end" style="height: 30px">
  <label
    class="blinking-label text-theme align-centre"
    *ngIf="fetchingData()"
    style="margin-left: auto"
  >
    {{fetchingDataString()}}
  </label>
  &nbsp;
  <label for="scaleSelect" class="scale-label">Scale:</label>
  <select
    id="scaleSelect"
    class="scale-select"
    [(ngModel)]="selectedScale"
    (ngModelChange)="onScaleChange($event)"
  >
    <option *ngFor="let scale of scaleOptions" [value]="scale.value">
      {{ scale.label }}
    </option>
  </select>
  <span class="action-icon-container">
    <mat-icon
      title="Theme"
      fontSet="material-symbols-outlined"
      (click)="toggleTheme()"
      class="action-icon"
      >contrast</mat-icon
    >
  </span>
  <span class="action-icon-container" (click)="OpenCardConfiguration()">
    <mat-icon title="Properties" class="action-icon">edit</mat-icon>
  </span>
  <span class="action-icon-container">
    <mat-icon title="Zoom In" (click)="zoomIn()" class="action-icon"
      >zoom_in</mat-icon
    >
  </span>
  <span class="action-icon-container" style="width: 50px" (click)="resetView()">
    <p style="margin: auto">Reset</p>
  </span>
  <span class="action-icon-container">
    <mat-icon title="Zoom Out" (click)="zoomOut()" class="action-icon"
      >zoom_out</mat-icon
    >
  </span>

  <span class="action-icon-container" (click)="cloneToPrivate()">
    <mat-icon title="Clone" class="action-icon">content_copy</mat-icon>
  </span>
</ng-container>
<ng-template #private>
  <span class="action-icon-container" (click)="updatePrivateDisplay(template?.templateId)">
    <mat-icon title="Save Changes" class="action-icon">save</mat-icon>
  </span>
</ng-template> -->
  <span class="action-icon-container">
    <mat-icon title="Print" class="action-icon" (click)="openPrintProperties()"
      >print</mat-icon
    >
  </span>
  <a
    href="javascript:;"
    class="btn btn-secondary btn-sm me-2 mb-1"
    (click)="toggleLiveFeeding()"
    [title]="isLivePolling ? 'Feeding' : 'Stop Feeding'"
    style="font-size: 14px; line-height: 1.5; opacity: 0.8"
    [style.background-color]="isLivePolling ? '#1CB386' : '#DC4E54'"
    ><i [class]="isLivePolling ? 'fa fa-arrow-down' : 'fa fa-arrow-up'"></i
  ></a>
</div>
<div class="well-log-container">
  <div
    #trackContainer
    class="canvas-wrapper"
    [style.visibility]="isFirstTimeLoading ? 'hidden' : 'visible'"
  >
    <app-basewidget #canvasWidget></app-basewidget>
    <app-cross-tooltip [data]="tooltipData"></app-cross-tooltip>
  </div>
  <div
    *ngIf="isFirstTimeLoading"
    style="position: absolute; left: 30%; top: 45%"
  >
    <img
      style="height: 150px; width: 150px"
      src="../../../../assets/images/loader.gif"
    />
  </div>
</div>
